<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FSM drill">
<meta name="theme-color" content="#0f172a">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>FSM Practice</title>
<style>
:root{--bg:#f8fafc;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#cbd5e1;--blue:#2563eb;--blue-s:#dbeafe;--green:#16a34a;--green-s:#dcfce7;--red:#dc2626;--red-s:#fee2e2;--amber:#b45309;--amber-s:#fef3c7;--top:#0f172a}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--panel:#111a2e;--ink:#e2e8f0;--muted:#94a3b8;--line:#2a3856;--blue:#60a5fa;--blue-s:#1e3a8a;--green:#4ade80;--green-s:#14532d;--red:#f87171;--red-s:#7f1d1d;--amber:#fbbf24;--amber-s:#78350f;--top:#0b1220}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);overscroll-behavior:none}
body{color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;margin:0}
sub,sup{line-height:0}
#app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
.top{flex:none;background:var(--top);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 6px) calc(12px + env(safe-area-inset-right)) 6px calc(16px + env(safe-area-inset-left))}
.dots{flex:1;display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-height:44px}
.dots i{width:10px;height:10px;border-radius:50%;background:#475569}
.dots i.on{background:#fff}.dots i.r{background:#4ade80}.dots i.h{background:#fbbf24}.dots i.w{background:#f87171}
.dots i.cur{box-shadow:0 0 0 2px #60a5fa}
.dots i.rt{border-radius:3px}
.gear{width:44px;height:44px;border:0;background:transparent;color:#fff;border-radius:10px;display:grid;place-items:center}
.gear:active{background:#1e293b}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;padding:14px calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left))}
.tag{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.pill{border:1px solid var(--line);border-radius:99px;padding:0 8px;line-height:20px;background:var(--panel);color:var(--muted);white-space:nowrap}
.q{font-size:19px;line-height:1.45;overflow-wrap:anywhere;word-break:break-word}
.q.lg{font-size:21px}
.ctx{font-size:17px;color:var(--muted);margin-top:6px}
.fb{margin-top:12px;font-size:17px;overflow-wrap:anywhere}
.fb:empty{display:none}
.fb .ok{color:var(--green);font-weight:600}.fb .bad{color:var(--red);font-weight:600}.fb .half{color:var(--amber);font-weight:600}
.note{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:16px}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>div{height:100%;width:0;background:var(--green)}.bar.over>div{background:var(--amber)}
.clock{font-size:14px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.ans{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;min-height:52px;padding:11px 14px;text-align:left;font-size:17px;line-height:1.35;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;overflow-wrap:anywhere;word-break:break-word}
.opt:active:not(:disabled){background:var(--blue-s)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--green-s);border-color:var(--green)}
.opt.bad{background:var(--red-s);border-color:var(--red)}
.opt.half{background:var(--amber-s);border-color:var(--amber)}
.opt.dim{opacity:.55}
.btn{display:block;width:100%;min-height:56px;padding:12px 14px;font-size:18px;font-weight:600;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);text-align:center}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.good{background:var(--green);border-color:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.btn.good{color:#052e16}}
.btn.badb{background:var(--panel);border-color:var(--red);color:var(--red)}
.btn:active{filter:brightness(.92)}
.foot{position:sticky;bottom:0;margin:0 -16px;padding:8px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);margin-top:8px}
.foot.hide{visibility:hidden}
.pad{height:calc(14px + env(safe-area-inset-bottom));flex:none}
.sum{margin:auto 0;text-align:center;padding:8px 0}
.sum .big{font-size:56px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.sum .sm{color:var(--muted);font-size:17px;margin-top:4px}
.sum .row{display:flex;justify-content:center;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:92px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--muted)}
.empty{margin:auto 0;text-align:center;color:var(--muted)}
.sheetbg{position:absolute;inset:0;background:rgba(2,6,23,.55);display:flex;align-items:flex-end;z-index:5}
.sheetbg[hidden]{display:none}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px calc(16px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));border-top:1px solid var(--line)}
.sheet h2{font-size:15px;margin:14px 0 6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sheet h2:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:6px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--panel);font-size:16px}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.seg{display:flex;gap:8px}.seg .chip{flex:1;border-radius:12px}
.info{font-size:14px;color:var(--muted);margin-top:14px}
.sheet .btn{margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="dots" id="dots" aria-label="Progress"></div>
    <button class="gear" id="gear" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div>
  <main id="main"></main>
  <div class="sheetbg" id="sheetbg" hidden><div class="sheet" id="sheet" role="dialog" aria-label="Settings"></div></div>
</div>

<script src="selftest_bank.js"></script>
<script src="selftest_drills.js"></script>
<script>
'use strict';
/* Phone practice page. Shares GEN, fmt, shuffle, pick, vecStr with selftest_drills.js (globals).
   Progress: Leitner boxes per id in localStorage 'fsm-mobile-v1' (separate from the desktop app's key). */
const BANK = window.QBANK || {};
const $q = (s, r = document) => r.querySelector(s);
const INTERVALS = [0, 1, 3, 7, 14, 30];
const KIND_LABEL = {terms: 'Terms', notation: 'Notation', results: 'Results', drills: 'Drills'};
const KIND_ORDER = ['terms', 'notation', 'results', 'drills'];
const CHAPTERS = {1: 'Floating point math', 2: 'ODE integration', 3: 'Collisionless particle systems', 4: 'Tree algorithms', 5: 'Particle-mesh technique', 6: 'Fourier techniques', 7: 'Iterative solvers & multigrid', 8: 'Molecular dynamics', 9: 'Basic gas dynamics', 10: 'Eulerian hydrodynamics', 11: 'Smoothed particle hydrodynamics', 12: 'Finite element methods', 13: 'Monte Carlo techniques'};
const CARD_CAT = {term: 'terms', notation: 'notation', result: 'results'};
const MAX_RETRY = 2;

/* ---------- pool ---------- */
/* section filter group = lecture chapter, from sec like "§2.7" (first number); anything else -> 'Other' */
function partOf(sec) { const m = /^§\s*(\d+)/.exec(sec || ''); return m && CHAPTERS[+m[1]] ? 'ch' + m[1] : 'Other'; }
const partLabel = k => k === 'Other' ? 'Other' : k.slice(2) + ' ' + CHAPTERS[+k.slice(2)];
const POOL = [], BYID = {};
(BANK.cards || []).forEach(c => POOL.push({id: c.id, type: 'card', cat: CARD_CAT[c.kind] || 'terms', part: partOf(c.sec), data: c}));
(BANK.drills || []).filter(d => typeof GEN !== 'undefined' && GEN[d.id]).forEach(d => POOL.push({id: d.id, type: 'drill', cat: 'drills', part: partOf(d.sec), data: d}));
POOL.forEach(p => { BYID[p.id] = p; });
const PARTS = [...new Set(POOL.map(p => p.part))].sort((a, b) => a === 'Other' ? 1 : b === 'Other' ? -1 : a.localeCompare(b, undefined, {numeric: true}));

/* ---------- persistence ---------- */
const KEY = 'fsm-mobile-v1';
let S = {v: 1, box: {}, set: {n: 5, offKinds: [], offParts: []}, sess: null, streak: {last: 0, n: 0}};
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) S = Object.assign(S, o, {set: Object.assign(S.set, o.set || {})}); } } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const today = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };

/* ---------- Leitner ---------- */
function applyBox(id, score) {
  const t = today(), r = S.box[id] || {b: 0, due: t};
  if (score >= 1) r.b = Math.min(5, r.b + 1);
  else if (score <= 0) r.b = 0;
  r.due = t + (score > 0 && score < 1 ? Math.max(1, INTERVALS[r.b]) : INTERVALS[r.b]);   // half right: same box, due at least tomorrow
  r.n = (r.n || 0) + 1; S.box[id] = r;
}
function touchStreak() {
  const t = today(), k = S.streak;
  if (k.last === t) return;
  k.n = k.last === t - 1 ? k.n + 1 : 1; k.last = t;
}
const activePool = () => POOL.filter(p => !S.set.offKinds.includes(p.cat) && !S.set.offParts.includes(p.part));

function draw(n) {
  const t = today(), pool = activePool(), bx = id => S.box[id];
  const due = shuffle(pool.filter(p => bx(p.id) && bx(p.id).due <= t)).sort((a, b) => bx(a.id).due - bx(b.id).due);
  const unseen = shuffle(pool.filter(p => !bx(p.id)));
  const rest = shuffle(pool.filter(p => bx(p.id) && bx(p.id).due > t)).sort((a, b) => bx(a.id).b - bx(b.id).b);
  const maxNew = Math.max(1, Math.round(n * 0.4)), maxCat = Math.max(1, Math.ceil(n * 0.6));
  const sel = [], seen = new Set(), cnt = {}; let nNew = 0;
  const add = (arr, capNew, capCat) => {
    for (const p of arr) {
      if (sel.length >= n) return;
      if (seen.has(p.id)) continue;
      const isNew = !bx(p.id);
      if (capNew && isNew && nNew >= maxNew) continue;
      if (capCat && (cnt[p.cat] || 0) >= maxCat) continue;
      sel.push(p); seen.add(p.id); cnt[p.cat] = (cnt[p.cat] || 0) + 1; if (isNew) nNew++;
    }
  };
  // due first (most overdue first), then unseen (<= 40 % of the session), then the lowest boxes; kinds capped at 60 %
  add(due, true, true); add(unseen, true, true); add(rest, true, true);
  add(due, true, false); add(unseen, true, false); add(rest, true, false);
  add(unseen, false, true); add(rest, false, true);
  add(unseen, false, false); add(due, false, false); add(rest, false, false);
  return arrange(sel);
}
function arrange(sel) {   // no two neighbours of the same kind where avoidable
  const left = shuffle(sel), out = [];
  while (left.length) {
    const last = out.length ? out[out.length - 1].cat : null, c = {};
    left.forEach(p => { c[p.cat] = (c[p.cat] || 0) + 1; });
    let cands = left.filter(p => p.cat !== last); if (!cands.length) cands = left;
    const top = Math.max(...cands.map(p => c[p.cat])), p = pick(cands.filter(x => c[x.cat] === top));
    out.push(p); left.splice(left.indexOf(p), 1);
  }
  return out;
}
function newSession() {
  const n = S.set.n, ids = draw(n);
  S.sess = ids.length ? {n, day: today(), queue: ids.map(p => ({id: p.id, retry: 0})), pos: 0, answered: false, res: [], finished: false} : null;
  save();
}

/* ---------- shell ---------- */
const main = $q('#main'), dotsEl = $q('#dots');
function drawDots() {
  const s = S.sess; if (!s) { dotsEl.innerHTML = ''; return; }
  dotsEl.innerHTML = s.queue.map((e, i) => {
    const r = s.res.find(x => x.qi === i);
    return `<i class="${[e.retry ? 'rt' : '', r ? (r.score >= 1 ? 'r' : r.score > 0 ? 'h' : 'w') : i < s.pos ? 'on' : '', i === s.pos && !s.finished ? 'cur' : ''].join(' ')}"></i>`;
  }).join('');
}
let timer = null;
const stopTimer = () => { if (timer) { clearInterval(timer); timer = null; } };
let cur = null;   // {e, p, done}

function render() {
  stopTimer(); cur = null;
  let s = S.sess;
  if (!s || s.finished) { newSession(); s = S.sess; }
  if (s && s.answered) { s.pos++; s.answered = false; save(); }   // reopened after answering: move on
  if (!s) { drawDots(); main.innerHTML = `<div class="empty"><p>No cards match your filters.</p><button class="btn pri" data-act="settings">Open settings</button></div><div class="pad"></div>`; return; }
  if (s.pos >= s.queue.length) return summary();
  drawDots();
  const e = s.queue[s.pos], p = BYID[e.id];
  if (!p) { s.queue.splice(s.pos, 1); save(); return render(); }
  cur = {e, p, done: false};
  try { ({card: rCard, drill: rDrill})[p.type](p); }
  catch (err) { console.error(err); s.queue.splice(s.pos, 1); save(); render(); }
}
const tagLine = (p, extra) => `<div class="tag"><span class="pill">${{card: {terms: 'Term', notation: 'Notation', results: 'Result'}[p.cat], drill: 'Drill'}[p.type]}</span><span class="pill">${p.data.sec || ''}</span>${extra || ''}${cur && cur.e.retry ? '<span class="pill">again</span>' : ''}</div>`;
const nextBtn = () => `<div class="foot hide" id="foot"><button class="btn pri" data-act="next">Next</button></div>`;
const optBtn = (html, i) => `<button class="opt" data-i="${i}">${html}</button>`;

function finish(score) {   // record the answer, save, reveal Next
  if (!cur || cur.done) return; cur.done = true;
  const s = S.sess, e = cur.e;
  s.res.push({id: e.id, score, retry: e.retry, qi: s.pos});
  if (!e.retry) applyBox(e.id, score);
  if (score <= 0 && e.retry < MAX_RETRY) s.queue.splice(s.pos + 1 + Math.min(2, s.queue.length - s.pos - 1), 0, {id: e.id, retry: e.retry + 1});
  s.answered = true; touchStreak(); save(); drawDots();
  const f = $q('#foot'); if (f) { f.classList.remove('hide'); }
}
function next() {
  const s = S.sess; if (!s) return;
  s.pos++; s.answered = false; save(); main.scrollTop = 0; render();
}
function summary() {
  const s = S.sess; s.finished = true; save(); drawDots();
  const first = s.res.filter(r => !r.retry), pts = first.reduce((a, r) => a + r.score, 0);
  const full = first.filter(r => r.score >= 1).length, half = first.filter(r => r.score > 0 && r.score < 1).length, miss = first.filter(r => r.score <= 0).length;
  const t = today(), tomorrow = activePool().filter(p => S.box[p.id] && S.box[p.id].due <= t + 1).length;
  const fr = x => { const w = Math.floor(x); return (x - w ? (w ? w : '') + '½' : String(w)); };
  main.innerHTML = `<div class="sum"><div class="big">${fr(pts)} / ${first.length}</div><div class="sm">${[full + ' right', half ? half + ' half' : '', miss + ' missed'].filter(Boolean).join(' · ')}</div>
    <div class="row"><div class="stat"><b>${tomorrow}</b><span>due tomorrow</span></div><div class="stat"><b>${S.streak.n}</b><span>day${S.streak.n === 1 ? '' : 's'} in a row</span></div></div></div>
    <div class="foot"><button class="btn pri" data-act="more">${S.set.n} more</button></div>`;
}

/* ---------- card types ---------- */
function rOptions(p, q, opts, correct, onTap, extraTag) {
  main.innerHTML = `${tagLine(p, extraTag)}<div class="q lg">${q}</div><div class="fb" id="fb"></div><div class="ans" id="ans">${opts.map(optBtn).join('')}</div>${nextBtn()}`;
  const ans = $q('#ans');
  ans.onclick = ev => {
    const b = ev.target.closest('.opt'); if (!b || cur.done) return;
    onTap(+b.dataset.i, b, ans);
  };
}
function rCard(p) {
  const c = p.data, opts = shuffle([c.back, ...c.distractors]), ok = opts.indexOf(c.back);
  rOptions(p, c.front, opts, ok, (i, b, ans) => {
    [...ans.children].forEach((x, j) => { x.disabled = true; x.classList.add(j === ok ? 'ok' : j === i ? 'bad' : 'dim'); });
    $q('#fb').innerHTML = (i === ok ? '<span class="ok">Right</span>' : '<span class="bad">Not quite</span>') + (c.note ? `<div class="note">${c.note}</div>` : '');
    finish(i === ok ? 1 : 0);
  });
}

/* How the phone page handles a generator result: 'choice' = tap an option, 'self' = mental answer + self-rating. */
function drillMode(g) {
  if (g && Array.isArray(g.options) && typeof g.correct === 'number' && g.kind === 'choice') return 'choice';
  if (g && g.kind === 'num' && typeof g.ans === 'number') return 'self';
  if (g && (g.kind === 'vec' || g.kind === 'set') && Array.isArray(g.ans)) return 'self';
  return null;
}
function drillAnswerText(g) {
  if (g.kind === 'vec') return vecStr(g.ans);
  if (g.kind === 'set') return '{' + g.ans.slice().sort((a, b) => a - b).map(fmt).join(', ') + '}';
  return fmt(g.ans);
}
function rDrill(p) {
  const d = p.data, g = GEN[d.id](), mode = drillMode(g);
  if (!mode) throw new Error('unhandled generator result for ' + d.id);
  const how = `<div class="note"><b>Work:</b> ${g.work}<br><b>Fast route:</b> ${d.how}</div>`;
  const extra = `<span class="pill">target ${d.target} s</span>`;
  if (mode === 'choice') {
    return rOptions(p, g.q, g.options, g.correct, (i, b, ans) => {
      [...ans.children].forEach((x, j) => { x.disabled = true; x.classList.add(j === g.correct ? 'ok' : j === i ? 'bad' : 'dim'); });
      $q('#fb').innerHTML = (i === g.correct ? '<span class="ok">Right</span>' : '<span class="bad">Not quite</span>') + how;
      finish(i === g.correct ? 1 : 0);
    }, extra);
  }
  const t0 = performance.now();
  main.innerHTML = `${tagLine(p, extra)}<div class="q lg">${g.q}</div><div class="ctx">Work it out in your head.</div>
    <div class="bar" id="bar"><div></div></div><div class="clock" id="clock">0 s</div><div class="fb" id="fb"></div>
    <div class="ans" id="ans"><button class="btn pri" data-act="reveal">Show answer</button></div><div class="pad"></div>`;
  const bar = $q('#bar'), clock = $q('#clock');
  const tick = () => { const sec = (performance.now() - t0) / 1000; bar.firstElementChild.style.width = Math.min(100, 100 * sec / d.target) + '%'; bar.classList.toggle('over', sec > d.target); clock.textContent = `${Math.round(sec)} s`; };
  timer = setInterval(tick, 250);
  cur.reveal = () => {
    stopTimer(); tick();
    $q('#fb').innerHTML = `<div class="q lg"><b>${drillAnswerText(g)}</b></div>${how}`;
    $q('#ans').innerHTML = `<button class="btn good" data-act="rate" data-v="1">Got it</button><button class="btn badb" data-act="rate" data-v="0">Missed</button>`;
  };
}
/* ---------- settings ---------- */
const sheetBg = $q('#sheetbg'), sheet = $q('#sheet');
let before = '', resetArmed = null;
const setSig = () => JSON.stringify([S.set.n, S.set.offKinds, S.set.offParts]);
function drawSheet() {
  const kinds = KIND_ORDER.filter(k => POOL.some(p => p.cat === k));
  const nCards = (BANK.cards || []).length, nDr = POOL.filter(p => p.type === 'drill').length;
  sheet.innerHTML = `<h2>Cards per session</h2><div class="seg">${[5, 10, 20].map(n => `<button class="chip" data-act="len" data-v="${n}" aria-pressed="${S.set.n === n}">${n}</button>`).join('')}</div>
    <h2>Kinds</h2><div class="chips">${kinds.map(k => `<button class="chip" data-act="kind" data-v="${k}" aria-pressed="${!S.set.offKinds.includes(k)}">${KIND_LABEL[k]}</button>`).join('')}</div>
    <h2>Course part</h2><div class="chips">${PARTS.map(k => `<button class="chip" data-act="part" data-v="${k}" aria-pressed="${!S.set.offParts.includes(k)}">${partLabel(k)}</button>`).join('')}</div>
    <div class="info">Bank ${BANK.generated || '?'} · ${nCards} cards · ${nDr} drills · ${activePool().length} selected · ${Object.keys(S.box).length} seen</div>
    <button class="btn badb" data-act="reset">${resetArmed ? 'Tap again to erase all progress' : 'Reset progress'}</button>
    <button class="btn pri" data-act="close">Done</button>`;
}
function openSheet() { before = setSig(); resetArmed = null; drawSheet(); sheetBg.hidden = false; }
function closeSheet() { sheetBg.hidden = true; clearTimeout(resetArmed); resetArmed = null; if (setSig() !== before) { S.sess = null; save(); render(); } }
function toggle(list, v) {
  const i = list.indexOf(v);
  if (i >= 0) list.splice(i, 1); else list.push(v);
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'next') next();
  else if (a === 'more') { S.sess = null; save(); main.scrollTop = 0; render(); }
  else if (a === 'reveal') { if (cur && cur.reveal) cur.reveal(); }
  else if (a === 'rate') finish(+v), next();
  else if (a === 'settings') openSheet();
  else if (a === 'close') closeSheet();
  else if (a === 'len') { S.set.n = +v; save(); drawSheet(); }
  else if (a === 'kind' || a === 'part') {
    const list = a === 'kind' ? S.set.offKinds : S.set.offParts, all = a === 'kind' ? KIND_ORDER.filter(k => POOL.some(p => p.cat === k)) : PARTS;
    if (!list.includes(v) && all.filter(x => !list.includes(x)).length <= 1) return;   // keep at least one on
    toggle(list, v); save(); drawSheet();
  }
  else if (a === 'reset') {
    if (!resetArmed) { resetArmed = setTimeout(() => { resetArmed = null; if (!sheetBg.hidden) drawSheet(); }, 4000); drawSheet(); return; }
    clearTimeout(resetArmed); resetArmed = null; S.box = {}; S.sess = null; S.streak = {last: 0, n: 0}; save(); drawSheet(); before = '';
  }
});
$q('#gear').onclick = openSheet;
sheetBg.addEventListener('click', ev => { if (ev.target === sheetBg) closeSheet(); });
document.addEventListener('keydown', ev => {   // desktop convenience: 1-4 pick an option, Enter / Space continue
  if (!sheetBg.hidden) { if (ev.key === 'Escape') closeSheet(); return; }
  if (ev.key >= '1' && ev.key <= '9') { const o = document.querySelectorAll('#ans .opt')[+ev.key - 1]; if (o && !o.disabled) o.click(); }
  else if (ev.key === 'Enter' || ev.key === ' ') { const f = $q('#foot:not(.hide) [data-act=next]') || $q('[data-act=reveal]') || $q('[data-act=more]'); if (f) { ev.preventDefault(); f.click(); } }
});

render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
